# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: zh-CN
tone_instructions: "使用简洁、具体、可执行的中文；优先指出正确性、安全性、并发和回归风险，并区分阻断问题与可选建议。"
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  poem: false

  path_filters:
    - "!out/**"
    - "!.vs/**"
    - "!Preview/**"
    - "!WindowsAppDataManager/resources/Icons/**"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - WIP
      - "DO NOT REVIEW"

  tools:
    github-checks:
      enabled: true

    actionlint:
      enabled: true

    zizmor:
      enabled: true

    yamllint:
      enabled: true

    gitleaks:
      enabled: true

    clang:
      enabled: true

    cppcheck:
      enabled: true

chat:
  auto_reply: false
