name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Qt 6.9.2 / MSVC 2022
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      BUILD_DIR: out/build/ci
      QT_VERSION: 6.9.2
      QT_ARCH: win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          cache-key-prefix: windows-msvc2022-qt

      - name: Configure
        shell: pwsh
        run: >
          cmake
          -S .
          -B "$env:BUILD_DIR"
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: QML lint
        shell: pwsh
        run: >
          cmake
          --build "$env:BUILD_DIR"
          --config Debug
          --target WindowsAppDataManager_qmllint
          --parallel 2
          --
          /bl:"$env:BUILD_DIR/qmllint.binlog"

      - name: Build
        shell: pwsh
        run: >
          cmake
          --build "$env:BUILD_DIR"
          --config Debug
          --parallel 2
          --
          /bl:"$env:BUILD_DIR/build.binlog"

      - name: Prepare test environment
        shell: pwsh
        run: |
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar
          )
          $testTempRoot = [System.IO.Path]::GetFullPath(
            (Join-Path $runnerTemp ("wam-test-temp-{0}-{1}" -f
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT))
          ).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          if ([System.IO.Path]::GetDirectoryName($testTempRoot) -ne $runnerTemp) {
            throw "测试临时目录必须直接位于 RUNNER_TEMP 下。"
          }
          New-Item -ItemType Directory -Path $testTempRoot -Force | Out-Null
          "WAM_TEST_TEMP_ROOT=$testTempRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$testTempRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTempRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test
        shell: pwsh
        run: >
          ctest
          --test-dir "$env:BUILD_DIR"
          -C Debug
          --output-on-failure
          --no-tests=error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build/ci/*.binlog
            out/build/ci/Testing/Temporary/
            out/build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean test artifacts
        if: always()
        shell: pwsh
        run: |
          $buildRoot = [System.IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE $env:BUILD_DIR)
          ).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          $testProcesses = @(
            "wam_backend_tests",
            "wam_installation_evidence_tests",
            "wam_executable_evidence_tests",
            "wam_executable_platform_tests",
            "wam_orphan_detection_tests",
            "wam_qml_models_tests"
          )
          Get-Process -Name $testProcesses -ErrorAction SilentlyContinue |
            Where-Object {
              $executable = $_.Path
              if ([string]::IsNullOrWhiteSpace($executable)) {
                return $false
              }
              $resolved = [System.IO.Path]::GetFullPath($executable)
              return $resolved.StartsWith(
                $buildRoot + [System.IO.Path]::DirectorySeparatorChar,
                [System.StringComparison]::OrdinalIgnoreCase
              )
            } |
            Stop-Process -Force -ErrorAction SilentlyContinue

          $testingRoot = [System.IO.Path]::GetFullPath(
            (Join-Path $buildRoot "Testing")
          ).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          $ctestTemporary = [System.IO.Path]::GetFullPath(
            (Join-Path $testingRoot "Temporary")
          ).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          if ([System.IO.Path]::GetDirectoryName($ctestTemporary) -ne
              $testingRoot) {
            throw "拒绝清理预期 Testing 目录外的 CTest 临时文件。"
          }
          if (Test-Path -LiteralPath $ctestTemporary -PathType Container) {
            $ctestItem = Get-Item -LiteralPath $ctestTemporary -Force
            if (($ctestItem.Attributes -band
                  [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "拒绝清理重解析点 CTest 临时目录。"
            }
            Remove-Item -LiteralPath $ctestTemporary -Recurse -Force
          }

          if ([string]::IsNullOrWhiteSpace($env:WAM_TEST_TEMP_ROOT)) {
            Write-Host "未创建专用测试临时目录，无需清理。"
            exit 0
          }
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar
          )
          $testTempRoot = [System.IO.Path]::GetFullPath(
            $env:WAM_TEST_TEMP_ROOT
          ).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          if ([System.IO.Path]::GetDirectoryName($testTempRoot) -ne $runnerTemp) {
            throw "拒绝清理 RUNNER_TEMP 外的测试目录。"
          }
          if (Test-Path -LiteralPath $testTempRoot -PathType Container) {
            $rootItem = Get-Item -LiteralPath $testTempRoot -Force
            if (($rootItem.Attributes -band
                  [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "拒绝清理重解析点测试目录。"
            }
            Remove-Item -LiteralPath $testTempRoot -Recurse -Force
          }
