name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的现有标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Qt 6.9.2 / Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      installer_name: ${{ steps.package.outputs.installer_name }}
      checksum_name: ${{ steps.package.outputs.checksum_name }}

    env:
      BUILD_DIR: out/build/github-release
      DIST_DIR: out/release
      QT_VERSION: 6.9.2
      QT_ARCH: win64_msvc2022_64
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $semverPattern = '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
          if ($env:RELEASE_TAG -cnotmatch $semverPattern) {
            throw "发布标签必须使用 vX.Y.Z 或 vX.Y.Z-prerelease 格式。"
          }

          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "远程仓库中不存在发布标签 $env:RELEASE_TAG。"
          }

          $tagCommit = (git rev-list -n 1 $tagRef).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -cne $headCommit) {
            throw "当前检出提交与发布标签不一致。"
          }
          if ($env:GITHUB_SHA -cne $tagCommit) {
            throw "工作流来源提交与发布标签不一致。"
          }
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and
              $env:GITHUB_REF -cne $tagRef) {
            throw "手动发布时必须使用 --ref $env:RELEASE_TAG 运行工作流。"
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $numericVersion = (($version -split '[-+]')[0]) + ".0"
          $versionWithoutBuild = ($version -split '\+', 2)[0]
          $isPrerelease = if ($versionWithoutBuild.Contains("-")) {
            "true"
          } else {
            "false"
          }
          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "WAM_RELEASE_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WAM_NUMERIC_VERSION=$numericVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_NAME=WindowsAppDataManager-$version-windows-x64" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          cache-key-prefix: windows-msvc2022-qt

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: >
          cmake
          -S .
          -B "$env:BUILD_DIR"
          -G "Ninja Multi-Config"
          -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DWAM_VERSION="$env:WAM_RELEASE_VERSION"

      - name: QML lint
        shell: pwsh
        run: >
          cmake
          --build "$env:BUILD_DIR"
          --config Release
          --target WindowsAppDataManager_qmllint
          --parallel 2

      - name: Build
        shell: pwsh
        run: >
          cmake
          --build "$env:BUILD_DIR"
          --config Release
          --parallel 2

      - name: Prepare test environment
        shell: pwsh
        run: |
          $testTempRoot = Join-Path $env:RUNNER_TEMP (
            "wam-release-test-{0}-{1}" -f
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          New-Item -ItemType Directory -Path $testTempRoot -Force | Out-Null
          "TEMP=$testTempRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTempRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test
        shell: pwsh
        run: >
          ctest
          --test-dir "$env:BUILD_DIR"
          -C Release
          --output-on-failure
          --no-tests=error

      - name: Build and verify Windows installer
        id: package
        shell: pwsh
        run: |
          $relativeExe = Join-Path $env:BUILD_DIR `
            "WindowsAppDataManager\Release\WindowsAppDataManager.exe"
          $builtExe = [System.IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE $relativeExe)
          )
          if (-not (Test-Path -LiteralPath $builtExe -PathType Leaf)) {
            throw "未找到 Release 可执行文件：$builtExe"
          }

          $stageRoot = Join-Path $env:RUNNER_TEMP (
            "wam-release-stage-{0}-{1}" -f
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $packageDir = Join-Path $stageRoot $env:PACKAGE_NAME
          $distDir = [System.IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE $env:DIST_DIR)
          )
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          $stagedExe = Join-Path $packageDir "WindowsAppDataManager.exe"
          Copy-Item -LiteralPath $builtExe -Destination $stagedExe
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\README.md" `
            -Destination $packageDir
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\LICENSE" `
            -Destination $packageDir
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\THIRD_PARTY_NOTICES.txt" `
            -Destination $packageDir
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\QT_SOURCE_OFFER.txt" `
            -Destination $packageDir
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\licenses" `
            -Destination $packageDir `
            -Recurse

          $deployTool = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path -LiteralPath $deployTool -PathType Leaf)) {
            throw "未找到 windeployqt：$deployTool"
          }
          & $deployTool `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE\WindowsAppDataManager" `
            --no-translations `
            --no-compiler-runtime `
            --no-system-d3d-compiler `
            --no-system-dxc-compiler `
            --no-opengl-sw `
            --skip-plugin-types "generic,qmltooling,networkinformation,tls" `
            --exclude-plugins "qtvirtualkeyboardplugin,qgif,qicns,qico,qjpeg,qtga,qtiff,qwbmp,qwebp,qsqlibase,qsqlmimer,qsqloci,qsqlodbc,qsqlpsql" `
            --verbose 0 `
            --dir $packageDir `
            $stagedExe
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt 部署失败，退出码 $LASTEXITCODE。"
          }

          $crtArchitectureDir = Join-Path $env:VCToolsRedistDir "x64"
          $crtDirectories = @(
            Get-ChildItem -LiteralPath $crtArchitectureDir `
              -Directory `
              -Filter "Microsoft.VC*.CRT"
          )
          if ($crtDirectories.Count -ne 1) {
            throw "无法唯一确定 MSVC app-local CRT 目录：$crtArchitectureDir"
          }

          $crtDlls = @(
            Get-ChildItem -LiteralPath $crtDirectories[0].FullName `
              -File `
              -Filter "*.dll"
          )
          if ($crtDlls.Count -eq 0) {
            throw "MSVC app-local CRT 目录中没有 DLL：$($crtDirectories[0].FullName)"
          }
          foreach ($crtDll in $crtDlls) {
            Copy-Item -LiteralPath $crtDll.FullName -Destination $packageDir
          }

          $qtLicenseDir = Join-Path $packageDir "licenses\qt"
          $qtLicenseManifest = Join-Path $qtLicenseDir "LICENSES.manifest"
          $qtLicenseNames = @(
            Get-Content -LiteralPath $qtLicenseManifest |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )
          if ($qtLicenseNames.Count -ne 41 -or `
              ($qtLicenseNames | Sort-Object -Unique).Count -ne 41) {
            throw "Qt 许可证清单必须包含 41 个互不重复的文件名。"
          }
          foreach ($licenseName in $qtLicenseNames) {
            $licensePath = Join-Path $qtLicenseDir $licenseName
            if (-not (Test-Path -LiteralPath $licensePath -PathType Leaf)) {
              throw "缺少 Qt 模块许可证文本：$licenseName"
            }
          }

          $qtSbomSourceDir = Join-Path $env:QT_ROOT_DIR "sbom"
          $qtSbomTargetDir = Join-Path $packageDir "licenses\qt\sbom"
          New-Item -ItemType Directory -Path $qtSbomTargetDir -Force |
            Out-Null
          $qtSbomNames = @(
            "qtbase-$env:QT_VERSION.spdx",
            "qtdeclarative-$env:QT_VERSION.spdx",
            "qtsvg-$env:QT_VERSION.spdx"
          )
          foreach ($sbomName in $qtSbomNames) {
            $sbomSource = Join-Path $qtSbomSourceDir $sbomName
            if (-not (Test-Path -LiteralPath $sbomSource -PathType Leaf)) {
              throw "Qt SDK 缺少发布模块 SBOM：$sbomSource"
            }
            Copy-Item -LiteralPath $sbomSource -Destination $qtSbomTargetDir
          }

          $requiredFiles = @(
            "WindowsAppDataManager.exe",
            "Qt6Core.dll",
            "Qt6Qml.dll",
            "Qt6Quick.dll",
            "Qt6QuickControls2Basic.dll",
            "Qt6QuickControls2BasicStyleImpl.dll",
            "Qt6Sql.dll",
            "Qt6Svg.dll",
            "platforms\qwindows.dll",
            "imageformats\qsvg.dll",
            "sqldrivers\qsqlite.dll",
            "qml\QtQuick\qtquick2plugin.dll",
            "qml\QtQuick\Controls\Basic\qtquickcontrols2basicstyleplugin.dll",
            "THIRD_PARTY_NOTICES.txt",
            "QT_SOURCE_OFFER.txt",
            "licenses\GPL-3.0-only.txt",
            "licenses\LGPL-3.0-only.txt",
            "licenses\qt\MIT.txt",
            "licenses\qt\HPND-sell-variant.txt",
            "licenses\qt\LICENSES.manifest",
            "licenses\qt\sbom\qtbase-$env:QT_VERSION.spdx",
            "licenses\qt\sbom\qtdeclarative-$env:QT_VERSION.spdx",
            "licenses\qt\sbom\qtsvg-$env:QT_VERSION.spdx",
            "licenses\icons\NOTICE.txt",
            "licenses\icons\Tabler-Icons-MIT.txt",
            "licenses\icons\Google-Material-Icons-Apache-2.0.txt",
            "concrt140.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          foreach ($relativePath in $requiredFiles) {
            $requiredPath = Join-Path $packageDir $relativePath
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "发布包缺少运行文件：$relativePath"
            }
          }

          $virtualKeyboardQmlDir = Join-Path $packageDir `
            "qml\QtQuick\VirtualKeyboard"
          if (Test-Path -LiteralPath $virtualKeyboardQmlDir -PathType Container) {
            $virtualKeyboardFiles = @(
              Get-ChildItem -LiteralPath $virtualKeyboardQmlDir `
                -File `
                -Recurse `
                -Force
            )
            if ($virtualKeyboardFiles.Count -gt 0) {
              throw "发布包包含未使用的 Qt Virtual Keyboard QML 文件。"
            }
            Remove-Item -LiteralPath $virtualKeyboardQmlDir -Recurse -Force
          }

          $unneededPaths = @(
            'networkinformation',
            'tls',
            'd3dcompiler_47.dll',
            'dxcompiler.dll',
            'dxil.dll',
            'opengl32sw.dll',
            'imageformats\qgif.dll',
            'imageformats\qicns.dll',
            'imageformats\qico.dll',
            'imageformats\qjpeg.dll',
            'imageformats\qtga.dll',
            'imageformats\qtiff.dll',
            'imageformats\qwbmp.dll',
            'imageformats\qwebp.dll',
            'sqldrivers\qsqlibase.dll',
            'sqldrivers\qsqlmimer.dll',
            'sqldrivers\qsqloci.dll',
            'sqldrivers\qsqlodbc.dll',
            'sqldrivers\qsqlpsql.dll',
            "generic",
            "qmltooling",
            "Qt6Quick3DUtils.dll",
            "Qt6QuickControls2FluentWinUI3StyleImpl.dll",
            "Qt6QuickControls2Fusion.dll",
            "Qt6QuickControls2FusionStyleImpl.dll",
            "Qt6QuickControls2Imagine.dll",
            "Qt6QuickControls2ImagineStyleImpl.dll",
            "Qt6QuickControls2Material.dll",
            "Qt6QuickControls2MaterialStyleImpl.dll",
            "Qt6QuickControls2Universal.dll",
            "Qt6QuickControls2UniversalStyleImpl.dll",
            "Qt6QuickControls2WindowsStyleImpl.dll",
            "qml\QtQuick\Controls\FluentWinUI3",
            "qml\QtQuick\Controls\Fusion",
            "qml\QtQuick\Controls\Imagine",
            "qml\QtQuick\Controls\Material",
            "qml\QtQuick\Controls\Universal",
            "qml\QtQuick\Controls\Windows",
            "qml\QtQuick\NativeStyle"
          )
          foreach ($relativePath in $unneededPaths) {
            $candidatePath = [System.IO.Path]::GetFullPath(
              (Join-Path $packageDir $relativePath)
            )
            if (-not $candidatePath.StartsWith(
                $packageDir + [System.IO.Path]::DirectorySeparatorChar,
                [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "待裁剪路径超出发布目录：$candidatePath"
            }
            if (Test-Path -LiteralPath $candidatePath -PathType Container) {
              Remove-Item -LiteralPath $candidatePath -Recurse -Force
            } elseif (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
              Remove-Item -LiteralPath $candidatePath -Force
            }
          }

          $forbiddenPaths = @(
            "Qt6VirtualKeyboard.dll",
            "Qt6Quick3DUtils.dll",
            "platforminputcontexts\qtvirtualkeyboardplugin.dll",
            "qml\QtQuick\VirtualKeyboard",
            "qml\QtQuick3D",
            "qtvirtualkeyboard",
            "qmltooling",
            "generic",
            "networkinformation",
            "tls",
            "d3dcompiler_47.dll",
            "dxcompiler.dll",
            "dxil.dll",
            "opengl32sw.dll",
            "imageformats\qgif.dll",
            "imageformats\qicns.dll",
            "imageformats\qico.dll",
            "imageformats\qjpeg.dll",
            "imageformats\qtga.dll",
            "imageformats\qtiff.dll",
            "imageformats\qwbmp.dll",
            "imageformats\qwebp.dll",
            "sqldrivers\qsqlibase.dll",
            "sqldrivers\qsqlmimer.dll",
            "sqldrivers\qsqloci.dll",
            "sqldrivers\qsqlodbc.dll",
            "sqldrivers\qsqlpsql.dll",
            "qml\QtQuick\Controls\FluentWinUI3",
            "qml\QtQuick\Controls\Fusion",
            "qml\QtQuick\Controls\Imagine",
            "qml\QtQuick\Controls\Material",
            "qml\QtQuick\Controls\Universal",
            "qml\QtQuick\Controls\Windows",
            "qml\QtQuick\NativeStyle"
          )
          foreach ($relativePath in $forbiddenPaths) {
            if (Test-Path -LiteralPath (Join-Path $packageDir $relativePath)) {
              throw "发布包包含未使用或许可范围外的文件：$relativePath"
            }
          }
          $quick3dLibraries = @(
            Get-ChildItem -LiteralPath $packageDir `
              -File `
              -Filter "Qt6Quick3D*.dll"
          )
          if ($quick3dLibraries.Count -gt 0) {
            throw "发布包包含未使用的 Qt Quick 3D 库：$($quick3dLibraries.Name -join ', ')"
          }

          $originalPath = $env:PATH
          $originalPluginPath = $env:QT_PLUGIN_PATH
          $originalQmlPath = $env:QML_IMPORT_PATH
          $originalQml2Path = $env:QML2_IMPORT_PATH
          $originalQuickBackend = $env:QT_QUICK_BACKEND
          $originalRhiBackend = $env:QSG_RHI_BACKEND
          $originalStartupCheck = $env:WAM_STARTUP_CHECK
          try {
            $env:PATH = $packageDir + ";" +
              (Join-Path $env:SystemRoot "System32") + ";" + $env:SystemRoot
            $env:QT_PLUGIN_PATH = ""
            $env:QML_IMPORT_PATH = ""
            $env:QML2_IMPORT_PATH = ""
            Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
            Remove-Item Env:QSG_RHI_BACKEND -ErrorAction SilentlyContinue
            $env:WAM_STARTUP_CHECK = "1"
            $process = Start-Process `
              -FilePath $stagedExe `
              -ArgumentList "--startup-check" `
              -WorkingDirectory $packageDir `
              -WindowStyle Hidden `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              throw "发布包启动检查失败，退出码 $($process.ExitCode)。"
            }
          } finally {
            $env:PATH = $originalPath
            $env:QT_PLUGIN_PATH = $originalPluginPath
            $env:QML_IMPORT_PATH = $originalQmlPath
            $env:QML2_IMPORT_PATH = $originalQml2Path
            $env:QT_QUICK_BACKEND = $originalQuickBackend
            $env:QSG_RHI_BACKEND = $originalRhiBackend
            $env:WAM_STARTUP_CHECK = $originalStartupCheck
          }

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $iscc) {
            throw "GitHub Runner 中未找到 Inno Setup 编译器。"
          }

          $installerScript = Join-Path $env:GITHUB_WORKSPACE `
            "packaging\windows\installer.iss"
          & $iscc `
            "/Qp" `
            "/DWamVersion=$env:WAM_RELEASE_VERSION" `
            "/DWamNumericVersion=$env:WAM_NUMERIC_VERSION" `
            "/DWamSourceDir=$packageDir" `
            "/DWamOutputDir=$distDir" `
            $installerScript
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败，退出码 $LASTEXITCODE。"
          }

          $installerName = "$env:PACKAGE_NAME-setup.exe"
          $installerPath = Join-Path $distDir $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "未生成预期的安装包：$installerPath"
          }

          $installDir = Join-Path $env:RUNNER_TEMP (
            "wam-release-install-{0}-{1}" -f
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $installLog = Join-Path $env:RUNNER_TEMP "wam-installer-smoke.log"
          $installArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/NOICONS",
            "/DIR=`"$installDir`"",
            "/LOG=`"$installLog`""
          )
          $installProcess = Start-Process `
            -FilePath $installerPath `
            -ArgumentList $installArguments `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "安装包静默安装失败，退出码 $($installProcess.ExitCode)。"
          }

          $installedExe = Join-Path $installDir "WindowsAppDataManager.exe"
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw "静默安装后未找到应用程序：$installedExe"
          }
          $installedNotice = Join-Path $installDir "THIRD_PARTY_NOTICES.txt"
          $installedQtSbom = Join-Path $installDir `
            "licenses\qt\sbom\qtbase-$env:QT_VERSION.spdx"
          $installedIconNotice = Join-Path $installDir `
            "licenses\icons\NOTICE.txt"
          $installedTablerLicense = Join-Path $installDir `
            "licenses\icons\Tabler-Icons-MIT.txt"
          $installedMaterialLicense = Join-Path $installDir `
            "licenses\icons\Google-Material-Icons-Apache-2.0.txt"
          foreach ($installedFile in @(
              $installedNotice,
              $installedQtSbom,
              $installedIconNotice,
              $installedTablerLicense,
              $installedMaterialLicense)) {
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw "静默安装后缺少许可材料：$installedFile"
            }
          }

          $systemRoot = $env:SystemRoot
          $savedPath = $env:PATH
          $savedPluginPath = $env:QT_PLUGIN_PATH
          $savedQmlPath = $env:QML_IMPORT_PATH
          $savedQml2Path = $env:QML2_IMPORT_PATH
          $savedQuickBackend = $env:QT_QUICK_BACKEND
          $savedRhiBackend = $env:QSG_RHI_BACKEND
          $savedStartupCheck = $env:WAM_STARTUP_CHECK
          try {
            $env:PATH = $installDir + ";" +
              (Join-Path $systemRoot "System32") + ";" + $systemRoot
            $env:QT_PLUGIN_PATH = ""
            $env:QML_IMPORT_PATH = ""
            $env:QML2_IMPORT_PATH = ""
            $env:QT_QUICK_BACKEND = "software"
            $env:QSG_RHI_BACKEND = "software"
            $env:WAM_STARTUP_CHECK = "1"
            $installedProcess = Start-Process `
              -FilePath $installedExe `
              -ArgumentList "--startup-check" `
              -WorkingDirectory $installDir `
              -WindowStyle Hidden `
              -Wait `
              -PassThru
            if ($installedProcess.ExitCode -ne 0) {
              throw "已安装应用启动检查失败，退出码 $($installedProcess.ExitCode)。"
            }
          } finally {
            $env:PATH = $savedPath
            $env:QT_PLUGIN_PATH = $savedPluginPath
            $env:QML_IMPORT_PATH = $savedQmlPath
            $env:QML2_IMPORT_PATH = $savedQml2Path
            $env:QT_QUICK_BACKEND = $savedQuickBackend
            $env:QSG_RHI_BACKEND = $savedRhiBackend
            $env:WAM_STARTUP_CHECK = $savedStartupCheck
          }

          $uninstallers = @(
            Get-ChildItem -LiteralPath $installDir `
              -File `
              -Filter "unins*.exe"
          )
          if ($uninstallers.Count -ne 1) {
            throw "静默安装后无法唯一确定卸载程序：$installDir"
          }
          $uninstaller = $uninstallers[0].FullName
          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "安装包静默卸载失败，退出码 $($uninstallProcess.ExitCode)。"
          }
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $uninstallDeadline -and `
                 ((Test-Path -LiteralPath $installedExe -PathType Leaf) -or `
                  (Test-Path -LiteralPath $uninstaller -PathType Leaf))) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path -LiteralPath $installedExe -PathType Leaf) {
            throw "静默卸载后应用程序仍然存在：$installedExe"
          }
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            throw "静默卸载后卸载程序仍然存在：$uninstaller"
          }

          $checksumPath = "$installerPath.sha256"
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" |
            Set-Content -LiteralPath $checksumPath -Encoding ascii

          "installer_path=$installerPath" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$checksumPath" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$installerName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_name=$([System.IO.Path]::GetFileName($checksumPath))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.installer_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.checksum_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      INSTALLER_NAME: ${{ needs.build.outputs.installer_name }}
      CHECKSUM_NAME: ${{ needs.build.outputs.checksum_name }}
      IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}

    steps:
      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.INSTALLER_NAME }}
          path: dist

      - name: Download checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CHECKSUM_NAME }}
          path: dist

      - name: Verify release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $installerPath = [System.IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE "dist/$env:INSTALLER_NAME")
          )
          $checksumPath = [System.IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE "dist/$env:CHECKSUM_NAME")
          )
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "未下载到安装包：$installerPath"
          }
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "未下载到校验文件：$checksumPath"
          }

          $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $escapedInstallerName = [regex]::Escape($env:INSTALLER_NAME)
          if ($checksumLine -cmatch "^([0-9a-f]{64})  $escapedInstallerName$") {
            $expectedHash = $Matches[1]
          } else {
            throw "SHA-256 文件格式或安装包名称不正确。"
          }
          $actualHash = (
            Get-FileHash -LiteralPath $installerPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) {
            throw "安装包 SHA-256 校验失败。"
          }

          "installer_path=$installerPath" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$checksumPath" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest release installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.installer_path }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.artifacts.outputs.installer_path }}
          CHECKSUM_PATH: ${{ steps.artifacts.outputs.checksum_path }}
        run: |
          $arguments = @(
            "release",
            "create",
            $env:RELEASE_TAG,
            $env:INSTALLER_PATH,
            $env:CHECKSUM_PATH,
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--verify-tag",
            "--generate-notes",
            "--title",
            "Windows AppData Manager $env:RELEASE_TAG"
          )
          if ($env:IS_PRERELEASE -eq "true") {
            $arguments += "--prerelease"
            $arguments += "--latest=false"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 发布失败，退出码 $LASTEXITCODE。"
          }
